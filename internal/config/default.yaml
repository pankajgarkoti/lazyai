# LazyAI project configuration. Existing files are never replaced or upgraded.
version: 1

interactive:
  # Templates are inactive until strict is true; free-form input is the default.
  strict: false
  # Select a template below by name. This selection is used when strict is true.
  default_contract: task
  # Skill-informed input forms, not bundled skills or evidence of usage frequency.
  # Comments and labels are not sent to the agent: answers must state boundaries.
  # No authority supplied by defaults; review restored drafts before sending.
  # Use references/aliases, never secret values.
  # Labels fit the 60x18 form with its sidebar: 14 cells required, 16 optional.
  # "Permit + stops" asks for allowed actions, explicit mutation authority (or none),
  # and stopping conditions. State these in answers; comments are not transmitted.
  contracts:
    # agent-run-contract: scope a run; do not turn diagnosis into edits or edits into release.
    task:
      title: Task contract
      fields:
        - key: outcome
          label: Outcome
          type: multiline
          required: true
        - key: acceptance
          label: Success checks
          type: multiline
          required: true
        - key: constraints
          # Scope, non-goals, allowed actions, and stopping conditions.
          label: Scope/allow/stop
          type: multiline
          required: false
    # system-mapping: explain current flow and ownership; stop before redesign or edits.
    system_mapping:
      title: System mapping
      fields:
        - key: target
          label: Target
          type: text
          required: true
        - key: question
          # What to explain and why; explanation only, no redesign or edits.
          label: Explain only
          type: multiline
          required: true
        - key: evidence
          label: Evidence refs
          type: multiline
          required: false
        - key: constraints
          # Depth, environment variants, and excluded paths.
          label: No design/edits
          type: multiline
          required: false
    # environment-forensics: retrieve facts/timeline; stop before causal claims or fixes.
    # Live-db/secret-handling guidance: explicit environment, bounded read-only sources,
    # no primary fallback or secret disclosure; project-specific access stays outside this file.
    environment_forensics:
      title: Environment forensics
      fields:
        - key: environment
          # Exact environment and source or replica alias; no credentials.
          label: Env/source
          type: text
          required: true
        - key: locator
          label: Scoped ID
          type: text
          required: true
        - key: window
          # Time range and timezone, or current-state snapshot.
          label: Time + zone
          type: text
          required: true
        - key: question
          label: Facts, not RCA
          type: multiline
          required: true
        - key: authority
          # Allowed reads, no mutations; redaction/query limits and stop conditions.
          label: Reads + stops
          type: multiline
          required: true
        - key: evidence
          label: Refs/age/gaps
          type: multiline
          required: false
    # behavior-intelligence: review a bounded corpus for patterns; stop before RCA or fixes.
    behavior_review:
      title: Behavior review
      fields:
        - key: environment
          label: Env/corpus
          type: text
          required: true
        - key: window
          label: Time + zone
          type: text
          required: true
        - key: population
          # Separate organic, dogfood, synthetic, and scheduled activity.
          label: Users/surfaces
          type: multiline
          required: true
        - key: question
          # Friction/adoption patterns only; no code-level RCA or fixes.
          label: Review, no RCA
          type: multiline
          required: true
        - key: authority
          # Allowed reads, no mutations; privacy limits and stop conditions.
          label: Reads + stops
          type: multiline
          required: true
        - key: evidence
          label: Refs/sample gaps
          type: multiline
          required: false
    # incident-adjudication: deduplicate and prioritize reports; stop before RCA or edits.
    incident_triage:
      title: Incident triage
      fields:
        - key: reports
          # Original evidence references, impact, affected scope and time.
          label: Reports/impact
          type: multiline
          required: true
        - key: expected
          label: Expected
          type: multiline
          required: true
        - key: history
          label: Incident history
          type: multiline
          required: false
        - key: constraints
          # Prioritization criteria, exclusions, and evidence limits; triage only.
          label: No RCA/edits
          type: multiline
          required: false
    # incident-rca: test causal hypotheses against original evidence; stop before fixes/release.
    incident_rca:
      title: Incident RCA
      fields:
        - key: incident
          label: Incident ID
          type: text
          required: true
        - key: environment
          label: Env/scope
          type: text
          required: true
        - key: evidence
          label: Failure/trace
          type: multiline
          required: true
        - key: expected
          label: Expected/good
          type: multiline
          required: true
        - key: authority
          # Allowed experiments, explicit mutations (none for diagnosis-only), stops.
          label: Permit + stops
          type: multiline
          required: true
        - key: constraints
          # Hypotheses, retry budget, unavailable evidence; stop before fixes/release.
          label: No fix/release
          type: multiline
          required: false
    # blast-radius-analysis: map affected paths and proof gaps; no production edits; hand off to design/TDD.
    blast_radius:
      title: Blast-radius analysis
      fields:
        - key: target
          label: Change target
          type: text
          required: true
        - key: change
          label: Now vs goal
          type: multiline
          required: true
        - key: preserve
          label: Must preserve
          type: multiline
          required: true
        - key: evidence
          label: Paths/proof gaps
          type: multiline
          required: false
        - key: constraints
          # Environment assumptions, exploration budget, unresolved intent; analysis only.
          label: No prod edits
          type: multiline
          required: false
    # change-design: resolve behavior and tradeoffs; deliver an implementable slice, then stop before edits.
    change_design:
      title: Change design
      fields:
        - key: outcome
          label: Design goal
          type: multiline
          required: true
        - key: acceptance
          label: Success/keep
          type: multiline
          required: true
        - key: evidence
          label: Goal/RCA/impact
          type: multiline
          required: false
        - key: constraints
          # Non-goals, compatibility, environment, rollout limits, open decisions.
          label: No code edits
          type: multiline
          required: false
    # tdd-change-delivery: implement stable intent via red/green and side-effect checks; stop before release.
    implementation:
      title: Implementation
      fields:
        - key: outcome
          label: Approved goal
          type: multiline
          required: true
        - key: acceptance
          label: Success/keep
          type: multiline
          required: true
        - key: authority
          # Allowed files/environment, explicit mutation authority and stops.
          label: Permit + stops
          type: multiline
          required: true
        - key: evidence
          label: Failure/RCA/refs
          type: multiline
          required: false
        - key: checks
          # Red reproduction, regressions, broader gates; no commit/push/release.
          label: Tests; no ship
          type: multiline
          required: false
    # change-verification: independently challenge a revision; report failures, do not repair or release.
    verification:
      title: Change verification
      fields:
        - key: revision
          label: Exact revision
          type: text
          required: true
        - key: environment
          label: Env/surface
          type: text
          required: true
        - key: acceptance
          label: Success/keep
          type: multiline
          required: true
        - key: authority
          # Allowed checks, explicit mutation authority and stops; report failures only.
          label: Permit + stops
          type: multiline
          required: true
        - key: evidence
          # Original red reproduction, change map, claimed tests; no repairs/release.
          label: No fix/release
          type: multiline
          required: false
    # integration-release: release only a verified revision with explicit authority; bounded health observation.
    release:
      title: Integration and release
      fields:
        - key: revision
          label: Verified ref
          type: text
          required: true
        - key: environment
          label: Env/deploy via
          type: text
          required: true
        - key: evidence
          label: Proof/risks
          type: multiline
          required: true
        - key: authority
          # Explicit push, PR, merge, deploy, rollback authority (or none), and stops.
          label: Permit + stops
          type: multiline
          required: true
        - key: recovery
          # Rollback/disable path, health and user-path checks, observation time limit.
          label: Recovery/check
          type: multiline
          required: true
        - key: constraints
          # Migrations, config, flags, secret aliases (never values).
          label: No secret values
          type: multiline
          required: false
    # live-incident-response: preserve evidence and contain active impact; stop after recovery, hand off to RCA.
    incident_response:
      title: Live incident response
      fields:
        - key: environment
          label: Env/service
          type: text
          required: true
        - key: impact
          label: Impact/since
          type: multiline
          required: true
        - key: evidence
          label: Signal/proof
          type: multiline
          required: true
        - key: authority
          # Explicit rollback/disable/isolate authority (or none), retry limits, stops.
          label: Permit + stops
          type: multiline
          required: true
        - key: recovery
          label: Recovery check
          type: multiline
          required: true
        - key: constraints
          # Recent changes, containment, privacy, escalation; stop after recovery.
          label: No broader fixes
          type: multiline
          required: false
    # outcome-accounting: compare promised and observed value after work/release; recommend, do not mutate.
    outcome_review:
      title: Outcome review
      fields:
        - key: target
          label: Work/window
          type: text
          required: true
        - key: outcome
          label: Promised value
          type: multiline
          required: true
        - key: evidence
          label: Observed/gaps
          type: multiline
          required: true
        - key: costs
          # Rework, deferred work, user supervision; activity is not value.
          label: Rework/overhead
          type: multiline
          required: false
        - key: constraints
          # Attribution limits, comparable baseline, next measurement; assessment only.
          label: No mutations
          type: multiline
          required: false
